name: anna_salon_mobile
description: BRIMOON Studio mobile app connected to the Django API.
publish_to: "none"
version: 0.1.49+50

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  http: ^1.2.2
  image: ^4.2.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^12.0.1
  print_bluetooth_thermal: 1.1.7
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - logo.png
