name: anna_salon_mobile
description: BRIMOON Studio mobile app connected to the Django API.
publish_to: "none"
version: 0.1.3+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - logo.png
